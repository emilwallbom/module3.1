[project]
name = "corvette-lmpc"
version = "0.1.0"
description = "Local LMPC racing laboratory with a Unity viewer"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.14", "osqp>=1.0", "clarabel>=0.11"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/racing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

